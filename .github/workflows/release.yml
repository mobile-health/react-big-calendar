name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'yarn'

      - name: Install Dependencies
        run: yarn install --frozen-lockfile

      - name: Build
        run: yarn build

      - name: Read Version
        run: node -e "const v=require('./package.json').version; require('fs').appendFileSync(process.env.GITHUB_ENV, 'VERSION='+v+'\\n')"

      - name: Create artifacts
        shell: bash
        run: |
          mkdir -p artifacts
          TARBALL=$(npm pack | tail -1)
          mv "$TARBALL" "artifacts/$TARBALL"
          ZIPNAME="react-big-calendar-${VERSION}.zip"
          FILES=()
          [[ -d dist ]] && FILES+=(dist)
          [[ -d lib ]] && FILES+=(lib)
          for f in LICENSE README.md CHANGELOG.md; do [[ -f "$f" ]] && FILES+=("$f"); done
          if [[ ${#FILES[@]} -gt 0 ]]; then
            zip -r "artifacts/${ZIPNAME}" "${FILES[@]}" -q
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.tgz
            artifacts/*.zip
